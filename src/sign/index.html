<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<!-- Rien ne sort de la machine : aucune connexion permise, scripts locaux seulement. Pas d'eval non plus : pdf.js 3.x
     doit en être privé (CVE-2024-4367, un PDF piégé y faisait exécuter du code). -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' file: 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; font-src data: blob:; frame-src blob:; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Remplir et signer</title>
<style>
/* couleurs recopiées de src/ui.html (thème Volt) ; Volt peut passer celles du thème en cours : ?a=%23ff8a00&bg=… */
:root{--a:#9b5cff;--bg:#0b0c10;--bg2:#13151c;--bg3:#1b1e28;--tx:#e8e9f0;--mu:#7d8296;--r:10px;--warn:#f5c542;color-scheme:dark}
*{box-sizing:border-box;margin:0}
[hidden]{display:none!important}
html,body{height:100%}
body{display:flex;flex-direction:column;background:var(--bg);color:var(--tx);font:13px "Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;overflow:hidden;user-select:none}
button,input{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
button:disabled,input:disabled{opacity:.35;cursor:default}
:focus-visible{outline:2px solid var(--a);outline-offset:1px}
svg.i{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* --- barre d'outils --- */
#bar{flex:none;display:flex;align-items:center;gap:4px;padding:8px 12px;background:var(--bg2);border-bottom:1px solid var(--bg3)}
.b{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 10px;border-radius:8px;white-space:nowrap}
.b:not(:disabled):hover{background:var(--bg3)}
.b[aria-pressed=true]{background:color-mix(in srgb,var(--a) 24%,transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--a) 65%,transparent)}
.b.ic{width:32px;padding:0;justify-content:center}
.btn{height:34px;padding:0 16px;border-radius:8px;background:var(--a);color:#fff;font-weight:600;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.btn:not(:disabled):hover{filter:brightness(1.15)}
.btn.g{background:var(--bg3);color:var(--tx)}
.sep{flex:none;width:1px;height:20px;background:var(--bg3);margin:0 6px}
.gap{flex:1}
.f{display:inline-flex;align-items:center;gap:6px;color:var(--mu);white-space:nowrap}
.f input{width:52px;height:30px;padding:0 6px;border-radius:8px;border:1px solid var(--bg3);background:var(--bg);color:var(--tx);text-align:center}
.sw{flex:none;width:20px;height:20px;margin:0 3px;border-radius:50%;background:var(--c);box-shadow:0 0 0 1px #fff4}
.sw[aria-pressed=true]{box-shadow:0 0 0 2px var(--bg2),0 0 0 4px var(--a)}
#zVal{min-width:58px;justify-content:center}
.lockmsg{display:inline-flex;align-items:center;gap:6px;color:var(--warn);font-size:12.5px;white-space:nowrap;max-width:260px;overflow:hidden;text-overflow:ellipsis}
#pages.locked .layer{pointer-events:none} /* document signé : plus d'interaction avec les éléments posés */
#pages.locked .el .h{display:none}
@media (max-width:1180px){#bar .b>span[data-t],.lockmsg{display:none}}

/* --- pages --- */
#view{flex:1;overflow:auto;position:relative;outline:0}
#pages{--z:1;display:flex;flex-direction:column;align-items:center;gap:16px;padding:24px;min-width:100%;width:max-content}
#pages:empty{display:none}
/* boîte au pixel entier : le canevas s'y affiche point pour point, net, où que soit la page dans le défilement */
.pg{position:relative;flex:none;width:round(calc(var(--w)*var(--z)*1px),1px);height:round(calc(var(--h)*var(--z)*1px),1px);background:#fff;box-shadow:0 2px 14px #000a}
.pg canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
/* calque des éléments posés : en points PDF (page à 100 % = 1 px par point), mis à l'échelle d'un bloc par le zoom */
.layer{position:absolute;left:0;top:0;width:calc(var(--w)*1px);height:calc(var(--h)*1px);transform-origin:0 0;transform:scale(var(--z))}
/* mode « Édition de PDF » : gérer les pages (supprimer, réordonner) */
.pgctrl{display:none;position:absolute;top:8px;right:8px;z-index:3;gap:6px;background:#1b1e28e0;border:1px solid #fff2;border-radius:10px;padding:5px;backdrop-filter:blur(6px)}
#pages.pagesmode .pgctrl{display:flex}
#pages.pagesmode .layer{pointer-events:none}
#pages.pagesmode .pg{cursor:default}
.pgctrl button{width:30px;height:30px;border-radius:7px;color:var(--tx);display:grid;place-items:center}
.pgctrl button:not(:disabled):hover{background:#ffffff1a}
.pgctrl button:disabled{opacity:.3}
.pgctrl .del:not(:disabled):hover{background:#c0344d;color:#fff}
.pgnum{position:absolute;top:8px;left:8px;z-index:3;min-width:24px;height:22px;padding:0 7px;border-radius:6px;background:#1b1e28cc;color:var(--mu);font-size:12px;display:none;align-items:center;justify-content:center}
#pages.pagesmode .pgnum{display:flex}
.pg.del{display:none}
[data-tool=text] .layer{cursor:text}
[data-tool=ink] .layer,[data-tool=ink] .el{cursor:crosshair}
[data-tool=place] .layer,[data-tool=place] .el{cursor:copy}
.layer>svg{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
.el{position:absolute;cursor:move;touch-action:none}
.el:hover{outline:calc(1px/var(--z)) dashed #8a90a6;outline-offset:calc(2px/var(--z))}
.el.sel{outline:calc(1.5px/var(--z)) solid var(--a);outline-offset:calc(2px/var(--z))}
.el.edit{cursor:text;outline:calc(1px/var(--z)) dashed var(--a);outline-offset:calc(2px/var(--z))}
.el img{display:block;width:100%;height:100%;pointer-events:none}
.el svg{display:block;width:100%;height:100%;overflow:visible;pointer-events:none}
/* texte : Arial a les chasses de la Helvetica du PDF ; ni crénage ni ligatures, le PDF n'en pose pas */
.el textarea{display:block;field-sizing:content;min-width:4px;border:0;padding:0;margin:0;background:none;resize:none;overflow:hidden;white-space:pre;font-family:Arial,Helvetica,sans-serif;line-height:1.2;font-kerning:none;font-variant-ligatures:none;text-rendering:geometricPrecision;letter-spacing:0;outline:0;pointer-events:none;user-select:text}
.el textarea::placeholder{color:#9aa0b5}
.el.edit textarea{pointer-events:auto;cursor:text}
.h{display:none;position:absolute;width:calc(10px/var(--z));height:calc(10px/var(--z));border-radius:50%;background:#fff;border:calc(1.5px/var(--z)) solid var(--a)}
.sel .h{display:block}
.h.nw{left:calc(-7px/var(--z));top:calc(-7px/var(--z));cursor:nwse-resize}
.h.ne{right:calc(-7px/var(--z));top:calc(-7px/var(--z));cursor:nesw-resize}
.h.sw{left:calc(-7px/var(--z));bottom:calc(-7px/var(--z));cursor:nesw-resize}
.h.se{right:calc(-7px/var(--z));bottom:calc(-7px/var(--z));cursor:nwse-resize}

/* --- page à vide --- */
#empty{position:absolute;inset:0;display:grid;place-items:center;padding:24px}
#empty>div{max-width:440px;text-align:center;display:grid;gap:14px;justify-items:center;padding:36px 32px;border-radius:14px;background:var(--bg2);border:1px dashed var(--bg3)}
#empty svg{width:34px;height:34px;color:var(--a)}
#empty h1{font-size:19px;font-weight:600}
#empty p{color:var(--mu);line-height:1.5}
body.over #empty>div,body.over #view{border-color:var(--a);box-shadow:inset 0 0 0 2px var(--a)}

/* --- pied --- */
#foot{flex:none;display:flex;gap:16px;justify-content:space-between;padding:6px 12px;background:var(--bg2);border-top:1px solid var(--bg3);color:var(--mu);font-size:12px}
#foot span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#toast{position:fixed;right:16px;bottom:44px;max-width:460px;padding:12px 18px;border-radius:var(--r);background:var(--bg3);border-left:3px solid var(--a);opacity:0;transform:translateY(8px);transition:.25s;pointer-events:none;line-height:1.45}
#toast.on{opacity:1;transform:none}
#toast.bad{border-left-color:var(--warn)}

/* --- fenêtre « Signature » --- */
dialog{margin:auto;width:min(640px,calc(100vw - 32px));border:1px solid var(--bg3);border-radius:14px;background:var(--bg2);color:var(--tx);padding:20px;box-shadow:0 20px 60px #000b}
dialog::backdrop{background:#000a}
dialog h2{font-size:16px;font-weight:600;margin-bottom:14px}
dialog h3{font-size:12px;font-weight:600;color:var(--mu);margin-bottom:8px}
#saved{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.sig{position:relative}
.sig>button:first-child{display:block;width:150px;height:64px;padding:6px;border-radius:8px;background:#fff}
.sig>button:first-child:hover{box-shadow:0 0 0 2px var(--a)}
.sig img{width:100%;height:100%;object-fit:contain;display:block}
.sig .x{position:absolute;right:-6px;top:-6px;width:20px;height:20px;border-radius:50%;background:var(--bg3);border:1px solid var(--mu);line-height:1;font-size:14px}
.sig .x:hover{background:#c0344d;border-color:#c0344d;color:#fff}
.tabs{display:flex;gap:4px;margin-bottom:10px}
.tabs button{height:30px;padding:0 12px;border-radius:8px;color:var(--mu)}
.tabs button:hover{background:var(--bg3)}
.tabs button[aria-selected=true]{background:var(--bg3);color:var(--tx)}
.paper{display:block;width:100%;height:200px;border-radius:var(--r);background:#fff}
#pad{cursor:crosshair;touch-action:none;background:linear-gradient(#cfd2dc,#cfd2dc) 24px 150px/calc(100% - 48px) 1px no-repeat #fff}
#typed{border:0;padding:0 24px;text-align:center;font-size:46px;user-select:text;outline-offset:-2px}
#typed::placeholder{color:#b9bccb}
#shot{display:grid;place-items:center;padding:10px;background:repeating-conic-gradient(#e6e8ef 0 25%,#fff 0 50%) 0 0/20px 20px}
#shot img{max-width:100%;max-height:180px;display:block}
.note{color:var(--mu);font-size:12px;line-height:1.45;margin-top:10px}
#sigErr{color:var(--warn);font-size:12px;margin-top:8px;min-height:1em}
.row{display:flex;align-items:center;gap:8px;margin-top:14px}
.row .note{margin:0 0 0 6px}
</style>
</head>
<body>

<header id="bar" role="toolbar">
  <button class="b" id="bOpen" data-tt="openTip"><svg class="i" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg><span data-t="open"></span></button>
  <i class="sep"></i>
  <button class="b need" data-pick="select" data-tt="selectTip"><svg class="i" viewBox="0 0 24 24"><path d="M5 3l14 7-6 2-2 6z"/></svg><span data-t="select"></span></button>
  <button class="b need" id="bSig" data-pick="place" data-tt="signTip"><svg class="i" viewBox="0 0 24 24"><path d="M3 17c3-6 5-11 7-11s0 9 2 9 3-5 5-5 1 4 4 4"/><path d="M3 21h18"/></svg><span data-t="sign"></span></button>
  <button class="b need" data-pick="text" data-tt="textTip"><svg class="i" viewBox="0 0 24 24"><path d="M5 7V4h14v3M12 4v16M9 20h6"/></svg><span data-t="text"></span></button>
  <button class="b need" data-pick="ink" data-tt="drawTip"><svg class="i" viewBox="0 0 24 24"><path d="M4 20l1-4L16 5l3 3L8 19z"/><path d="M14 7l3 3"/></svg><span data-t="draw"></span></button>
  <i class="sep"></i>
  <button class="b need" id="bPages" data-tt="pagesTip"><svg class="i" viewBox="0 0 24 24"><rect x="4" y="3" width="11" height="14" rx="1.5"/><path d="M8 7h4M8 10h4"/><path d="M18 7v12a1.5 1.5 0 0 1-1.5 1.5H8"/></svg><span data-t="pages"></span></button>
  <i class="sep"></i>
  <label class="f" data-tt="sizeTip"><span data-t="size"></span><input class="need" id="size" type="number" min="4" max="200" step="1" value="12"></label>
  <button class="sw need" data-c="#000000" style="--c:#000000;margin-left:8px" data-tt="black"></button>
  <button class="sw need" data-c="#0b3fc5" style="--c:#0b3fc5" data-tt="blue"></button>
  <i class="sep"></i>
  <button class="b ic" id="bUndo" data-tt="undo"><svg class="i" viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg></button>
  <button class="b ic" id="bRedo" data-tt="redo"><svg class="i" viewBox="0 0 24 24"><path d="M15 14l5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h3"/></svg></button>
  <button class="b ic" id="bDel" data-tt="del"><svg class="i" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg></button>
  <span class="gap"></span>
  <button class="b ic need" id="zOut" data-tt="zoomOut"><svg class="i" viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button>
  <button class="b need" id="zVal" data-tt="zoomFit"><span>100 %</span></button>
  <button class="b ic need" id="zIn" data-tt="zoomIn"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
  <i class="sep"></i>
  <label class="f"><span data-t="page"></span><input class="need" id="pno" type="number" min="1" value="1"><span id="pcount">/ 0</span></label>
  <i class="sep"></i>
  <span class="lockmsg" id="lockMsg" hidden data-t="signedLock"></span>
  <button class="btn g need" id="bUnsign" hidden data-tt="unsignTip"><svg class="i" viewBox="0 0 24 24"><path d="M3 21h18M5 17l2-6 9-9 4 4-9 9zM14 3l4 4"/><path d="M4 15l-1 4 4-1"/></svg><span data-t="unsign"></span></button>
  <button class="b ic need" id="bPrint" data-tt="printTip"><svg class="i" viewBox="0 0 24 24"><path d="M6 9V3h12v6M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2M6 14h12v7H6z"/></svg></button>
  <i class="sep"></i>
  <button class="btn" id="bSave" data-tt="saveTip"><svg class="i" viewBox="0 0 24 24"><path d="M12 4v11M7 11l5 5 5-5M5 20h14"/></svg><span data-t="save"></span></button>
</header>

<main id="view" tabindex="0">
  <div id="empty"><div>
    <svg class="i" viewBox="0 0 24 24"><path d="M3 17c3-6 5-11 7-11s0 9 2 9 3-5 5-5 1 4 4 4"/><path d="M3 21h18"/></svg>
    <h1 data-t="emptyTitle"></h1>
    <p id="emptyText" data-t="emptyText"></p>
    <button class="btn" id="bOpen2" data-t="open"></button>
    <p data-t="drop"></p>
  </div></div>
  <div id="pages" data-tool="select"></div>
</main>

<footer id="foot"><span id="hint"></span><span data-t="legal"></span></footer>
<div id="toast" role="status" aria-live="polite"></div>

<dialog id="dSig" aria-labelledby="sigT">
  <h2 id="sigT" data-t="sigTitle"></h2>
  <div id="savedWrap"><h3 data-t="sigSaved"></h3><div id="saved"></div></div>
  <h3 data-t="sigNew"></h3>
  <div class="tabs" role="tablist">
    <button role="tab" data-m="draw" data-t="tabDraw"></button>
    <button role="tab" data-m="type" data-t="tabType"></button>
    <button role="tab" data-m="img" data-t="tabImg"></button>
  </div>
  <canvas class="paper" id="pad" width="1200" height="400" data-pane="draw"></canvas>
  <input class="paper" id="typed" maxlength="60" spellcheck="false" autocomplete="off" data-pane="type" data-ph="typedPh">
  <div data-pane="img">
    <div class="paper" id="shot"><img id="prev" alt="" hidden></div>
    <div class="row"><button class="btn g" id="pick" data-t="pick"></button><p class="note" data-t="imgHint"></p></div>
  </div>
  <p id="sigErr" role="alert"></p>
  <div class="row">
    <button class="sw" data-c="#000000" style="--c:#000000" data-tt="black"></button>
    <button class="sw" data-c="#0b3fc5" style="--c:#0b3fc5" data-tt="blue"></button>
    <button class="b" id="sClear" data-t="clear"></button>
    <span class="gap"></span>
    <button class="btn g" id="sCancel" data-t="cancel"></button>
    <button class="btn" id="sUse" data-t="use"></button>
  </div>
  <p class="note"><span data-t="kept"></span> <span data-t="legal"></span></p>
</dialog>

<input type="file" id="fPdf" accept=".pdf,application/pdf" hidden>
<input type="file" id="fImg" accept="image/png,image/jpeg,image/*" hidden>

<!-- Téléchargées une fois par Volt dans ce dossier (voir libs.json). Le « worker » chargé par balise : pdf.js travaille
     alors dans la page, sans Worker (refusé en file://). -->

<script src="pdf.worker.min.js"></script>

    if (el.t === "text") { el.size = clamp(o.size * w / bw, 4, 200); w = bw * el.size / o.size; h = bh * el.size / o.size; }
    else { el.w = w; el.h = h; }
    el.x = d.sx > 0 ? ax : ax - w; el.y = d.sy > 0 ? ay : ay - h;
  }
  fit(el, w, h); geom(nodeOf(el.id), el);
});
function endDrag() {
  const d = drag; if (!d) return; drag = null;
  if (d.k === "ink") { d.svg.remove(); addInk(d.pg, d.pts); }
  else if (d.moved) commit();
}
for (const t of ["pointerup", "pointercancel", "lostpointercapture"]) pagesEl.addEventListener(t, endDrag);
pagesEl.addEventListener("dblclick", e => {   // la souris est capturée : on cherche l'élément sous le pointeur
  const n = document.elementFromPoint(e.clientX, e.clientY)?.closest(".el.text");
  if (n && edit == null && tool !== "ink" && tool !== "place") startEdit(+n.dataset.id);
});

// ===== fenêtre « Signature » =====
const pad = $("#pad"), pctx = pad.getContext("2d"), typed = $("#typed");
let mode = "draw", strokes = [], impSig = null;
// écriture manuscrite du système si l'une d'elles est installée, sinon italique
const HAND = (() => {
  const c = document.createElement("canvas").getContext("2d"), w = f => (c.font = "40px " + f, c.measureText("Signature Volt 123").width), base = w("monospace");
  const f = ["Segoe Script", "Ink Free", "Lucida Handwriting", "Bradley Hand ITC", "Segoe Print", "Mistral", "Brush Script MT"].find(f => w(`"${f}", monospace`) !== base);
  return f ? { style: "", family: `"${f}"` } : { style: "italic", family: 'Georgia, "Times New Roman", serif' };
})();
typed.style.fontFamily = HAND.family; typed.style.fontStyle = HAND.style || "normal";

// rogne le canevas à l'encre : la boîte posée suit la signature, pas la feuille
function trim(cv) {
  const { width: w, height: h } = cv, d = cv.getContext("2d").getImageData(0, 0, w, h).data;
  let x0 = w, y0 = h, x1 = -1, y1 = -1;
  for (let y = 0, i = 3; y < h; y++) for (let x = 0; x < w; x++, i += 4) if (d[i] > 8) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
  if (x1 < 0) return null;
  const o = document.createElement("canvas"); o.width = x1 - x0 + 1; o.height = y1 - y0 + 1;
  o.getContext("2d").drawImage(cv, -x0, -y0); return o;
}
const sigOf = (cv, type = "image/png") => cv && { src: cv.toDataURL(type, .92), w: cv.width, h: cv.height };
function typedCanvas() {
  const s = typed.value.trim(); if (!s) return null;
  const c = document.createElement("canvas"), x = c.getContext("2d"), f = `${HAND.style} 120px ${HAND.family}`;
  x.font = f; c.width = Math.ceil(x.measureText(s).width) + 240; c.height = 360;   // marge : les lettres liées débordent de leur chasse
  x.font = f; x.fillStyle = color; x.textBaseline = "middle"; x.fillText(s, 120, 180);
  return trim(c);
}
async function importImg(file) {
  $("#sigErr").textContent = "";
  const im = new Image(), url = URL.createObjectURL(file);
  try {
    im.src = url; await im.decode();
    const w = im.naturalWidth || 600, h = im.naturalHeight || 300, k = Math.min(1, 1600 / Math.max(w, h));   // assez fin pour l'impression, léger à garder
    const c = document.createElement("canvas"); c.width = Math.round(w * k); c.height = Math.round(h * k);
    c.getContext("2d").drawImage(im, 0, 0, c.width, c.height);
    const jpg = file.type === "image/jpeg";   // un JPG n'a pas de transparence : gardé en JPG, sans rognage
    impSig = jpg ? sigOf(c, "image/jpeg") : sigOf(trim(c));
    if (!impSig) throw 0;
    $("#prev").src = impSig.src; $("#prev").hidden = false;
  } catch { impSig = null; $("#prev").hidden = true; msg(T.badImg, true); }
  URL.revokeObjectURL(url); syncSig();
}
function drawPad() {
  pctx.clearRect(0, 0, pad.width, pad.height);
  pctx.strokeStyle = color; pctx.lineWidth = 6; pctx.lineCap = pctx.lineJoin = "round";
  for (const s of strokes) pctx.stroke(new Path2D(pathD(s)));
}
function syncSig() {
  for (const b of $$(".tabs button")) b.ariaSelected = b.dataset.m === mode;
  for (const n of $$("[data-pane]")) n.hidden = n.dataset.pane !== mode;
  for (const n of $$("#dSig .sw, #sClear")) n.hidden = mode === "img";
  typed.style.color = color;
  $("#sUse").disabled = !(mode === "draw" ? strokes.length : mode === "type" ? typed.value.trim() : impSig);
}
function listSigs() {
  const box = $("#saved"), list = loadSigs(); box.textContent = ""; $("#savedWrap").hidden = !list.length;
  list.forEach((s, i) => {
    const w = document.createElement("div"), b = document.createElement("button"), im = new Image(), x = document.createElement("button");
    w.className = "sig"; im.src = s.src; im.alt = ""; b.title = b.ariaLabel = T.sigUse; b.append(im);
    b.onclick = () => { dlg.close(); setTool("place", s); };
    x.className = "x"; x.textContent = "×"; x.title = x.ariaLabel = T.sigDel;
    x.onclick = () => { saveSigs(loadSigs().filter((_, j) => j !== i)); listSigs(); };
    w.append(b, x); box.append(w);
  });
}
function openSig() {
  endEdit(); strokes = []; impSig = null; typed.value = ""; $("#prev").hidden = true; $("#sigErr").textContent = "";
  listSigs(); drawPad(); syncSig(); dlg.showModal();
}
const padPt = e => { const r = pad.getBoundingClientRect(); return [r2((e.clientX - r.left) * pad.width / r.width), r2((e.clientY - r.top) * pad.height / r.height)]; };
pad.addEventListener("pointerdown", e => { if (e.button) return; pad.setPointerCapture(e.pointerId); strokes.push([padPt(e)]); drawPad(); syncSig(); });
pad.addEventListener("pointermove", e => {
  if (!pad.hasPointerCapture(e.pointerId)) return;
  for (const c of e.getCoalescedEvents?.() ?? [e]) strokes.at(-1).push(padPt(c));
  drawPad();
});
typed.addEventListener("input", syncSig);
for (const b of $$(".tabs button")) b.onclick = () => { mode = b.dataset.m; syncSig(); if (mode === "type") typed.focus(); };
$("#pick").onclick = () => $("#fImg").click();
$("#fImg").onchange = e => { const f = e.target.files[0]; e.target.value = ""; if (f) importImg(f); };
$("#sClear").onclick = () => { strokes = []; typed.value = ""; drawPad(); syncSig(); };
$("#sCancel").onclick = () => dlg.close();
$("#sUse").onclick = () => {
  const s = mode === "img" ? impSig : sigOf(mode === "draw" ? trim(pad) : typedCanvas());
  if (!s) return;
  dlg.close(); const list = loadSigs(); if (!list.some(x => x.src === s.src)) saveSigs([s, ...list]);
  setTool("place", s);
};

// ===== enregistrement : un nouveau PDF, l'original n'est jamais réécrit =====
async function buildPdf() {
  const { PDFDocument, StandardFonts, rgb, pushGraphicsState, popGraphicsState, concatTransformationMatrix, setLineJoin, LineCapStyle, LineJoinStyle } = PDFLib;
  // nouveau document : pages gardées, dans l'ordre choisi (mode Édition) ; l'original n'est jamais réécrit
  const srcDoc = await PDFDocument.load(bytes), doc = await PDFDocument.create(), cache = new Map();
  const kept = order.filter(pi => !delPages.has(pi));
  const copied = await doc.copyPages(srcDoc, kept);
  const font = els.some(e => e.t === "text") && await doc.embedFont(StandardFonts.Helvetica);
  const rgbOf = c => rgb(...[1, 3, 5].map(i => parseInt(c.slice(i, i + 2), 16) / 255));
  const image = async src => { if (!cache.has(src)) cache.set(src, await (src.startsWith("data:image/jpeg") ? doc.embedJpg(src) : doc.embedPng(src))); return cache.get(src); };
  const encodable = s => { try { font.encodeText(s); return true; } catch { return false; } };
  let asImage = false;
  for (let idx = 0; idx < kept.length; idx++) {
    const pi = kept[idx], page = copied[idx]; doc.addPage(page);
    const list = els.filter(e => e.p === pi); if (!list.length) continue;
    const pg = pgs[pi], H = pg.h;
    // Repère « page affichée » (points, y vers le haut) -> repère du PDF : pdf.js connaît la rotation et le cadre de la
    // page, on lui demande où tombent l'origine et les deux axes.
    const P = (x, y) => pg.vp.convertToPdfPoint(x, H - y), [e, f] = P(0, 0), [ax, ay] = P(1, 0), [cx, cy] = P(0, 1);
    page.pushOperators(pushGraphicsState(), concatTransformationMatrix(ax - e, ay - f, cx - e, cy - f, e, f), setLineJoin(LineJoinStyle.Round));
    for (const el of list) {
      if (el.t === "img") page.drawImage(await image(imgs.get(el.k).src), { x: el.x, y: H - el.y - el.h, width: el.w, height: el.h });
      else if (el.t === "ink") page.drawSvgPath(pathD(el.pts, el.w / el.w0, el.h / el.h0), { x: el.x, y: H - el.y, borderColor: rgbOf(el.c), borderWidth: el.lw, borderLineCap: LineCapStyle.Round });
      else if (encodable(el.text.replace(/\n/g, ""))) page.drawText(el.text, { x: el.x, y: H - el.y - baseOf(el.size), size: el.size, lineHeight: el.size * LH, font, color: rgbOf(el.c) });
      else {   // caractère hors de la police standard (émoji, ✓, alphabet non latin) : ce bloc part en image plutôt que d'être perdu
        const k = 4, n = nodeOf(el.id), c = document.createElement("canvas"), x = c.getContext("2d");
        c.width = Math.ceil(n.offsetWidth * k); c.height = Math.ceil(n.offsetHeight * k);
        x.font = `${el.size * k}px ${FONT}`; x.fontKerning = "none"; x.fillStyle = el.c;
        el.text.split("\n").forEach((l, i) => x.fillText(l, 0, (baseOf(el.size) + i * LH * el.size) * k));
        page.drawImage(await image(c.toDataURL()), { x: el.x, y: H - el.y - c.height / k, width: c.width / k, height: c.height / k });
        asImage = true;
      }
    }
    page.pushOperators(popGraphicsState());
  }
  return { out: await doc.save(), asImage };
}
async function save() {
  endEdit(); if (!pdf || !edited() || busy) return;
  busy = true; msg(T.saving); await paint();
  try {
    const { out, asImage } = await buildPdf(), a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([out], { type: "application/pdf" }));
    a.download = fname.replace(/\.pdf$/i, "") + T.suffix + ".pdf"; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 60000);
    dirty = false; msg(asImage ? T.asImage : T.saved.replace("%s", a.download), asImage);
  } catch (e) { console.error(e); msg(T.saveFail, true); }
  busy = false;
}

// ===== impression : le PDF avec ce qui est posé dessus, ouvert dans un cadre caché qui s'imprime lui-même =====
// Le PDF part en data: dans une page qui l'embarque et appelle sa PROPRE fenêtre d'impression : depuis une page
// file://, le parent ne peut pas appeler print() sur le cadre (origine opaque), mais le cadre le peut sur lui-même.
function u8ToB64(u8) {
  let s = ""; const C = 0x8000;
  for (let i = 0; i < u8.length; i += C) s += String.fromCharCode.apply(null, u8.subarray(i, i + C));
  return btoa(s);
}
async function printPdf() {
  if (!pdf || busy) return;
  busy = true; msg(T.printing); await paint();
  try {
    const out = els.length ? (await buildPdf()).out : bytes;
    const src = "data:application/pdf;base64," + u8ToB64(out);
    const html = '<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;height:100%}embed{width:100%;height:100%}</style></head><body>'
      + '<embed type="application/pdf" src="' + src + '">'
      + '<' + 'script>onload=function(){parent.postMessage("sign-print-ready","*");setTimeout(function(){try{focus();print()}catch(e){}},700)}<' + '/script></body></html>';
    const url = URL.createObjectURL(new Blob([html], { type: "text/html" }));
    const f = document.createElement("iframe");
    f.style.cssText = "position:fixed;right:0;bottom:0;width:1px;height:1px;opacity:0;border:0";
    f.src = url; document.body.append(f);
    setTimeout(() => { f.remove(); URL.revokeObjectURL(url); }, 120000); // le temps de la fenêtre d'impression
    msg("");
  } catch (e) { console.error(e); msg(T.saveFail, true); }
  busy = false;
}
// retire toutes les signatures posées : le document redevient modifiable
$("#bUnsign").onclick = () => {
  const pages = new Set(els.filter(e => e.t === "img").map(e => e.p));
  if (!pages.size) return;
  els = els.filter(e => e.t !== "img"); sel = null; drawLayers(pages); commit(); setTool("select");
};

// ===== commandes =====
$("#bOpen").onclick = $("#bOpen2").onclick = () => $("#fPdf").click();
$("#bPrint").onclick = printPdf;
$("#bPages").onclick = () => setPagesMode(!pagesMode);
$("#fPdf").onchange = e => { const f = e.target.files[0]; e.target.value = ""; openFile(f); };
for (const b of $$("[data-pick]")) b.onclick = () => b.dataset.pick === "place" ? openSig() : setTool(b.dataset.pick);
for (const b of $$(".sw")) b.onclick = () => {
  color = b.dataset.c; const el = sel != null && elOf(sel);
  if (el && el.t !== "img" && el.c !== color) { el.c = color; geom(nodeOf(el.id), el); commit(); }
  sync(); drawPad(); syncSig();
};
$("#size").onchange = e => {
  size = clamp(+e.target.value || 12, 4, 200); const el = sel != null && elOf(sel);
  if (el?.t === "text" && el.size !== size) { el.size = size; geom(nodeOf(el.id), el); commit(); }
  sync();
};
$("#bUndo").onclick = () => go(-1); $("#bRedo").onclick = () => go(1); $("#bDel").onclick = del; $("#bSave").onclick = save;
$("#zOut").onclick = () => setZoom(z / 1.25); $("#zIn").onclick = () => setZoom(z * 1.25); $("#zVal").onclick = () => setZoom(fitZoom());
view.addEventListener("wheel", e => { if (e.ctrlKey && pdf) { e.preventDefault(); setZoom(z * (e.deltaY < 0 ? 1.1 : 1 / 1.1)); } }, { passive: false });
pno.onchange = () => { const kept = order.filter(pi => !delPages.has(pi)); pgs[kept[clamp(pno.value - 1, 0, kept.length - 1)]]?.el.scrollIntoView(); pno.blur(); };   // suit l'ordre d'affichage ; le champ rend la main au défilement
let scrollT = 0;
view.addEventListener("scroll", () => {
  scrollT ||= requestAnimationFrame(() => {
    scrollT = 0; const r = view.getBoundingClientRect(), n = document.elementFromPoint(r.left + r.width / 2, r.top + r.height / 2)?.closest(".pg");
    if (n && document.activeElement !== pno) pno.value = pgs[+n.dataset.i].num.textContent; // numéro d'affichage (ordre, suppressions)
  });
}, { passive: true });

addEventListener("keydown", e => {
  if (dlg.open) return;
  const c = e.ctrlKey || e.metaKey, k = e.key.toLowerCase(), el = sel != null && elOf(sel), lock = els.some(x => x.t === "img");
  if (k === "escape") return edit != null ? endEdit() : tool !== "select" ? setTool("select") : select(null);
  if (c && k === "s") { e.preventDefault(); return save(); }
  if (c && k === "p") { e.preventDefault(); return printPdf(); }
  if (c && k === "o") { e.preventDefault(); return $("#fPdf").click(); }
  if (e.target.matches("input, textarea")) return;   // dans un champ : ses propres raccourcis
  if (c && k === "z") { e.preventDefault(); go(e.shiftKey ? 1 : -1); }
  else if (c && k === "y") { e.preventDefault(); go(1); }
  else if (el && !lock && (k === "delete" || k === "backspace")) { e.preventDefault(); del(); }
  else if (el && !lock && k.startsWith("arrow")) {   // réglage fin au clavier (Maj : 10 points)
    e.preventDefault(); const n = nodeOf(sel), s = e.shiftKey ? 10 : 1;
    el.x += k === "arrowleft" ? -s : k === "arrowright" ? s : 0; el.y += k === "arrowup" ? -s : k === "arrowdown" ? s : 0;
    fit(el, n.offsetWidth, n.offsetHeight); geom(n, el); commit();
  }
});
addEventListener("dragover", e => { e.preventDefault(); document.body.classList.add("over"); });
addEventListener("dragleave", e => { if (!e.relatedTarget) document.body.classList.remove("over"); });
addEventListener("drop", e => { e.preventDefault(); document.body.classList.remove("over"); if (!dlg.open) openFile(e.dataTransfer.files[0]); });
addEventListener("beforeunload", e => { if (dirty) e.preventDefault(); });

if (LIBS) window.ipc?.postMessage("sign:ready");   // Volt peut alors appeler voltOpen
else { $("#emptyText").textContent = T.noLibs; $("#bOpen").disabled = $("#bOpen2").disabled = true; }
setTool("select");
</script>
