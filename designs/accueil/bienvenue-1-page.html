<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>Bienvenue : page unique</title>
<link rel="stylesheet" href="base.css">
<style>
main{display:grid;grid-template-columns:360px minmax(0,640px);justify-content:center;gap:56px;padding:0 40px;overflow:hidden}
.hello{align-self:center;display:flex;flex-direction:column;align-items:flex-start}
.hello .volty{width:168px;height:168px;margin:0 0 22px -10px}
.hello h1{font-size:30px;font-weight:600;letter-spacing:-.01em;margin-bottom:10px}
.hello p{color:var(--mu);font-size:14px;line-height:1.55;margin-bottom:26px;max-width:320px}
.hello .btn{height:42px;padding:0 28px;font-size:14px}
.hello small{color:var(--mu);margin-top:10px;font-size:12px}
.opts{overflow:auto;padding:28px 6px 28px 0}
.opts section+section{margin-top:22px}
.opts .cap{margin-bottom:8px}
.row{min-height:58px;padding:10px 16px}
.row>div:not(.sw-c){flex:1;min-width:0}
.opts{align-self:center;max-height:100%}
.imp .fi{margin-right:-4px}
.imp,.pw{justify-content:flex-start}
.pw .gi{width:24px;height:24px;display:grid;place-items:center;color:var(--mu);flex:none;margin-right:-4px}
.pw small{font-style:italic}
.row.def .btn{flex:none}
.themes{margin-bottom:8px}
.th span{font-size:12px}
</style></head><body>
<script src="data.js"></script>
<script>document.write(chrome("Bienvenue"))</script>
<div id="panel"><main>
  <div class="hello in">
    <div class="volty" id="vy"></div>
    <h1>Bienvenue dans Volt</h1>
    <p>Quelques réglages pour démarrer. Tout est facultatif : vous les retrouverez plus tard dans les Réglages.</p>
    <button class="btn" id="go">Commencer</button>
    <small>Commencer ferme cette page et ouvre vos favoris.</small>
  </div>
  <div class="opts in">
    <section><h3 class="cap">Importer vos favoris</h3><div id="imp"></div>
      <div class="row pw"><span class="gi"></span><div><b>Mots de passe et comptes</b><small>Mots de passe : à venir</small></div></div></section>
    <section><h3 class="cap">Navigateur par défaut</h3><div id="def"></div></section>
    <section id="look"><h3 class="cap">Apparence</h3><div class="themes"></div><div class="row"><div><b>Couleur d'accent</b></div><div class="sw-c"></div></div></section>
  </div>
</main></div>
<script>
$("#vy").innerHTML=voltySvg("",false);
$(".pw .gi").innerHTML=ic("key");
$("#imp").innerHTML=BROWSERS.map(importRow).join("");
wireImport($("#imp"),()=>$("#vy").classList.add("wink"));
if(P.get("importe"))$("#imp .btn").click();
function def(){$("#def").innerHTML=defRow();wireDefault($("#def"),def)}def();
looks($("#look"));
$("#go").onclick=()=>toast("La bienvenue se ferme, la page de favoris s'ouvre.");
</script>
</body></html>
