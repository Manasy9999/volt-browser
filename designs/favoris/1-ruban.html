<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>Favoris 1 : Ruban</title>
<link rel="stylesheet" href="base.css">
<style>
.fv{height:30px;display:flex;align-items:center;gap:2px;padding:0 4px 0 6px;background:var(--bg3);border-bottom:1px solid #000;position:relative}
/* dossier ouvert : un filet de sa couleur sous la bande, seul rappel coloré */
.fv.open{box-shadow:inset 0 -2px 0 var(--c)}
.rail{flex:1;min-width:0;height:100%;display:flex;align-items:center;gap:1px;overflow-x:auto;scrollbar-width:none;scroll-behavior:smooth;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 var(--fl),#000 calc(100% - var(--fr)),transparent);--fl:0px;--fr:0px}
.rail.l{--fl:28px}.rail.r{--fr:36px}
.it{display:flex;align-items:center;gap:7px;height:24px;padding:0 8px;border-radius:6px;white-space:nowrap;flex:none;max-width:200px;color:var(--tx);transition:background .12s}
.it span{overflow:hidden;text-overflow:ellipsis}
.it:hover{background:color-mix(in srgb,var(--tx) 9%,transparent)}
.it:active{background:color-mix(in srgb,var(--tx) 14%,transparent)}
.it.dir{font-weight:500}
.sep{width:1px;height:14px;background:var(--mu);opacity:.35;margin:0 6px;flex:none}
/* en-tête du dossier ouvert */
.head{display:flex;align-items:center;gap:6px;height:24px;padding:0 10px 0 6px;border-radius:6px;flex:none;font-weight:600;
  background:color-mix(in srgb,var(--c) 22%,transparent)}
.head:hover{background:color-mix(in srgb,var(--c) 32%,transparent)}
.head svg.b{width:14px;height:14px;color:var(--mu)}
.head small{font-weight:400;color:var(--mu);margin-left:2px}
.arr,.all{height:24px;border-radius:6px;display:grid;place-items:center;color:var(--mu);flex:none;transition:background .12s,color .12s}
.arr{width:24px}
.arr[hidden]{display:none}
.arr:hover,.all:hover{color:var(--tx);background:color-mix(in srgb,var(--tx) 9%,transparent)}
.arr svg{width:14px;height:14px}
.all{display:flex;gap:6px;padding:0 8px;margin-left:2px;border-left:1px solid color-mix(in srgb,var(--mu) 30%,transparent);border-radius:0 6px 6px 0}
.all svg{width:14px;height:14px}
.all b{font-weight:500;font-variant-numeric:tabular-nums}
</style></head><body>
<script src="data.js"></script>
<script>
const CHEV=d=>`<svg viewBox="0 0 24 24"><path d="${d?"m9 18 6-6-6-6":"m15 18-6-6 6-6"}"/></svg>`;
function mount(root,st){
  root.innerHTML="";
  const fv=h("div","fv"),left=h("button","arr"),rail=h("div","rail"),right=h("button","arr"),all=h("button","all");
  left.innerHTML=CHEV(0);right.innerHTML=CHEV(1);left.title="Défiler à gauche";right.title="Défiler à droite";
  all.innerHTML='<svg viewBox="0 0 24 24"><rect x="4" y="4" width="6" height="6" rx="1.5"/><rect x="14" y="4" width="6" height="6" rx="1.5"/><rect x="4" y="14" width="6" height="6" rx="1.5"/><rect x="14" y="14" width="6" height="6" rx="1.5"/></svg><b>'+TOTAL+'</b>';
  all.title="Tous les favoris (page de favoris)";all.onclick=()=>showFavPage(true);
  fv.append(left,rail,right,all);root.append(fv);
  const dir=FOLDERS.find(d=>d.id===st.open);
  const close=()=>mount(root,{});
  if(dir){
    fv.classList.add("open");fv.style.setProperty("--c",dir.color);
    const hd=h("button","head");hd.title="Revenir à la barre (Échap)";
    hd.innerHTML=CHEV(0).replace("<svg","<svg class=\"b\"");hd.append(dirIco(dir),h("span",null,dir.name),h("small",null,dir.items.length));
    hd.onclick=close;rail.append(hd,h("i","sep"));
    dir.items.forEach(n=>rail.append(item(n)));
    if(root.id==="live")document.onkeydown=e=>{if(e.key==="Escape")close()};
  }else{
    FOLDERS.forEach(d=>{const b=h("button","it dir");b.append(dirIco(d),h("span",null,d.name));b.title=d.name+" : "+d.items.length+" favoris";b.onclick=()=>mount(root,{open:d.id});rail.append(b)});
    rail.append(h("i","sep"));
    ROOT.forEach(n=>rail.append(item(n)));
  }
  // flèches et fondus seulement quand il reste quelque chose de caché de ce côté
  const upd=()=>{const s=rail.scrollLeft,m=rail.scrollWidth-rail.clientWidth;
    left.hidden=s<=1;right.hidden=s>=m-1;rail.classList.toggle("l",s>1);rail.classList.toggle("r",s<m-1)};
  rail.onscroll=upd;
  rail.onwheel=e=>{if(!e.deltaX){rail.scrollLeft+=e.deltaY;e.preventDefault()}};
  left.onclick=()=>rail.scrollLeft-=rail.clientWidth*.8;
  right.onclick=()=>rail.scrollLeft+=rail.clientWidth*.8;
  upd();
}
function item(n){const b=h("button","it");b.append(favIco(n),h("span",null,n));b.title=n+"\n"+host(n);b.onclick=()=>go(n);return b}
scaffold(mount,"<b>Essayer :</b> molette sur la barre pour défiler, flèches aux bords, clic sur un dossier puis sur son en-tête (ou Échap) pour revenir, bouton « 138 » pour la page de favoris.");
</script></body></html>
