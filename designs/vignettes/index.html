<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="dark">
<title>Vignettes « Préférés » — page de favoris</title>
<style>
:root{--a:#9b5cff;--bg:#0b0c10;--bg2:#13151c;--bg3:#1b1e28;--tx:#e8e9f0;--mu:#7d8296;--r:10px}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--bg);color:var(--tx);font:13px "Segoe UI Variable Text","Segoe UI",system-ui,sans-serif}
h2{font-size:15px}
small{color:var(--mu)}

/* faux chrome du navigateur */
#tabs{height:38px;display:flex;align-items:flex-end;gap:4px;padding:0 8px;background:var(--bg)}
#logo{width:30px;height:30px;margin:0 6px 4px 0;display:grid;place-items:center;color:var(--a)}
#logo svg{width:20px;height:20px;fill:var(--a)}
.tab{height:32px;min-width:150px;display:flex;align-items:center;gap:8px;padding:0 10px 0 12px;background:var(--bg3);color:var(--tx);border-radius:var(--r) var(--r) 0 0}
.tab .dot{width:8px;height:8px;border-radius:50%;background:var(--a)}
#bar{height:46px;display:flex;align-items:center;gap:8px;padding:0 10px;background:var(--bg2)}
#url{flex:1;height:30px;border-radius:999px;background:var(--bg);border:0;color:var(--tx);padding:0 14px;font:inherit}
#favbar{height:30px;display:flex;align-items:center;gap:10px;padding:0 10px;background:var(--bg3);font-size:12px;color:var(--mu)}
#favbar b{color:var(--tx);font-weight:500}

#board{padding:22px 0 60px}
/* vignettes : PLEINE LARGEUR */
.rows{margin:0 0 30px}
.rail{overflow:hidden;position:relative;margin-bottom:14px}
.rail .head{color:var(--mu);font-size:12px;font-weight:600;letter-spacing:.4px;text-transform:uppercase;margin:0 0 10px 28px}
/* fondu sur les bords pour que les cartes « entrent » et « sortent » en douceur */
.rail::before,.rail::after{content:"";position:absolute;top:0;bottom:0;width:60px;z-index:2;pointer-events:none}
.rail::before{left:0;background:linear-gradient(90deg,var(--bg),transparent)}
.rail::after{right:0;background:linear-gradient(270deg,var(--bg),transparent)}
/* pas de `gap` : l'espacement est dans chaque carte (margin-right). Sinon un gap en trop au raccord des deux
   copies décale le -50% et la boucle « saute ». Ainsi une copie = exactement la moitié du ruban. */
.track{display:flex;width:max-content;padding:6px 0;will-change:transform}
/* défilement doux, lent, INFINI. Cartes dupliquées (2 copies) ; on translate de la largeur EXACTE d'une copie
   (--w, mesurée en JS) : boucle sans couture ni saut, sur les deux lignes. Durée proportionnelle à la largeur
   (--d) => même vitesse en haut et en bas. Haut -> droite, bas -> gauche. Pause au survol. */
.track{animation-timing-function:linear;animation-iteration-count:infinite;animation-duration:var(--d,45s)}
.track.rtl{animation-name:defDroite}
.track.ltr{animation-name:defGauche}
.rail:hover .track{animation-play-state:paused}
@keyframes defDroite{from{transform:translateX(calc(-1*var(--w)))}to{transform:translateX(0)}}
@keyframes defGauche{from{transform:translateX(0)}to{transform:translateX(calc(-1*var(--w)))}}
@media (prefers-reduced-motion:reduce){.track{animation:none!important}}
.addhead{margin-left:auto;margin-right:28px;background:var(--bg3);color:var(--tx);border:0;border-radius:8px;width:28px;height:28px;font-size:18px;cursor:pointer}
.rail .head{display:flex;align-items:center}

.card{flex:none;width:300px;height:160px;margin-right:16px;border-radius:16px;overflow:hidden;position:relative;cursor:pointer;background:var(--c);
  transition:transform .2s cubic-bezier(.2,.8,.2,1),box-shadow .2s;will-change:transform}
/* fond = dégradé aux couleurs du site (toujours net). Image perso -> elle prend le fond à la place. */
.card::before{content:"";position:absolute;inset:0;z-index:0;background:linear-gradient(135deg,var(--c),color-mix(in srgb,var(--c) 32%,#000) 135%)}
/* le logo NET, à taille raisonnable (jamais étiré) -> net comme dans les dossiers */
.card .logo{position:absolute;inset:0;display:grid;place-items:center;z-index:1;padding-bottom:16px;transition:transform .25s}
.card .logo img{width:96px;height:96px;object-fit:contain;filter:drop-shadow(0 5px 16px #0008)}
.card .logo .ltr{font-size:54px;font-weight:800;color:#fff;text-shadow:0 2px 10px #0007}
.card:hover .logo{transform:scale(1.07)}
/* image perso : elle remplit le fond, logo en petit badge posé dessus */
.card .back{display:none}
.card.img::before{opacity:0}
.card.img .logo{display:none}
.card.img .back{display:block;position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;transition:transform .25s}
.card.img:hover .back{transform:scale(1.06)}
.card .badge{display:none}
.card.img .badge{display:block;position:absolute;top:12px;left:12px;z-index:1;width:34px;height:34px;object-fit:contain;border-radius:8px;background:#ffffff2e;padding:4px;backdrop-filter:blur(4px)}
.card .meta{position:absolute;left:0;right:0;bottom:0;z-index:2;padding:28px 16px 12px;background:linear-gradient(0deg,#000e,transparent);text-shadow:0 1px 6px #000a}
.card .meta b{font-size:16px;font-weight:600}
.card:hover{transform:translateY(-3px);box-shadow:0 12px 34px #000b,0 0 0 2px var(--a)}
.card .pen{position:absolute;top:10px;right:10px;z-index:3;width:30px;height:30px;border-radius:9px;border:0;background:#000b;color:#fff;display:grid;place-items:center;opacity:0;cursor:pointer;transition:opacity .15s}
.card:hover .pen{opacity:1}
.card .pen svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2}

/* recherche + dossiers + favoris : colonne CENTRÉE */
#wrap{max-width:1060px;margin:0 auto;padding:0 28px}
.search{max-width:680px;margin:0 auto 30px;height:46px;border-radius:999px;background:var(--bg2);display:flex;align-items:center;gap:10px;padding:0 18px;color:var(--mu)}
.cap{color:var(--mu);font-size:12px;font-weight:600;letter-spacing:.4px;text-transform:uppercase;margin:0 0 12px;text-align:center}
.folders{display:flex;gap:18px;flex-wrap:wrap;justify-content:center;margin-bottom:30px}
.folder{width:190px;cursor:pointer;text-align:center}
/* VRAIS logos des sites ESTOMPÉS en fond + teinte du dossier, et l'icône du dossier CENTRÉE devant */
.folder .box{width:190px;height:116px;border-radius:16px;overflow:hidden;position:relative;border:1px solid color-mix(in srgb,var(--c) 45%,transparent);background:color-mix(in srgb,var(--c) 32%,#0b0c10)}
.folder .box .mosaic{position:absolute;inset:0;display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:1fr;gap:2px;padding:8px;opacity:.5}
.folder .box .mosaic .cell{display:grid;place-items:center;overflow:hidden}
.folder .box .mosaic img{width:40px;height:40px;object-fit:contain}
.folder .box .mosaic .ltr{font-weight:700;font-size:16px;color:#fff}
/* teinte diagonale par-dessus les logos (les met "derrière") */
.folder .box::after{content:"";position:absolute;inset:0;background:linear-gradient(135deg,color-mix(in srgb,var(--c) 42%,transparent),color-mix(in srgb,var(--c) 72%,#000))}
/* icône du dossier, centrée, avec un halo doux */
.folder .box .ic{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:1;width:64px;height:64px;display:grid;place-items:center;font-size:32px;border-radius:50%;
  background:radial-gradient(circle,color-mix(in srgb,var(--c) 55%,#000c),transparent 72%);filter:drop-shadow(0 2px 7px #000b)}
.folder b{display:block;margin-top:9px;font-size:14px}
.folder small{font-size:12px}
.tiles{display:flex;flex-wrap:wrap;gap:14px;justify-content:center}
.tile{width:96px;text-align:center;cursor:pointer}
.tile .ic{width:52px;height:52px;margin:0 auto 6px;border-radius:14px;display:grid;place-items:center;background:var(--bg2);overflow:hidden}
.tile .ic img{width:30px;height:30px}
.tile span{font-size:12px;color:var(--mu);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* éditeur */
#ed{position:fixed;inset:0;z-index:20;background:#000b;display:none;place-items:center}
#ed.on{display:grid}
#ed .box{width:420px;max-width:92vw;background:var(--bg2);border:1px solid #fff2;border-radius:16px;padding:22px}
#ed label{display:block;font-size:12px;color:var(--mu);margin:14px 0 6px}
#ed input[type=text]{width:100%;height:38px;border-radius:10px;border:1px solid #fff2;background:var(--bg);color:var(--tx);padding:0 12px;font:inherit}
#ed .prev{height:100px;border-radius:12px;background:center/cover no-repeat var(--bg3);display:grid;place-items:center;color:var(--mu);overflow:hidden}
#ed .imgbtns{display:flex;gap:8px;margin-top:8px}
#ed button{font:inherit;border:0;border-radius:10px;padding:9px 14px;cursor:pointer;background:var(--bg3);color:var(--tx)}
#ed .row{display:flex;justify-content:space-between;margin-top:22px}
#ed .ok{background:var(--a);color:#fff;font-weight:600}
#ed .del{background:none;color:#ff6b6b}
</style>
</head>
<body>
<div id="tabs"><div id="logo"><svg viewBox="0 0 24 24"><path d="M13 2 4 14h6l-1 8 9-12h-6z"/></svg></div><div class="tab"><i class="dot"></i>Favoris</div></div>
<div id="bar"><input id="url" value="volt://newtab" readonly></div>
<div id="favbar"><b>Jeux</b> · <b>Dev</b> · <b>Vidéos</b> · <b>Achats</b> · YouTube · Twitch · GitHub · <b>+27</b></div>

<main id="board">
  <div class="rows" id="rows"></div>
  <div id="wrap">
    <div class="search"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg> Rechercher sur Google ou saisir une adresse</div>
    <h3 class="cap">Dossiers</h3>
    <div class="folders" id="folders"></div>
    <h3 class="cap">Sans dossier</h3>
    <div class="tiles" id="tiles"></div>
  </div>
</main>

<div id="ed">
  <div class="box">
    <h3>Modifier la vignette</h3>
    <label>Nom</label><input type="text" id="edN" placeholder="YouTube">
    <label>Lien</label><input type="text" id="edU" placeholder="https://www.youtube.com">
    <label>Image (optionnelle)</label>
    <div class="prev" id="edImg"><small>aucune image : logo du site</small></div>
    <div class="imgbtns"><button id="edPic">Choisir une image…</button><button id="edClr">Retirer l'image</button></div>
    <label>Couleur de la carte</label>
    <div class="imgbtns"><input type="color" id="edCol" style="width:54px;height:38px;border:0;border-radius:10px;background:none;cursor:pointer;padding:0"><button id="edColAuto">Auto (d'après le logo)</button></div>
    <div class="row"><button class="del">Supprimer</button><span><button id="edCancel">Annuler</button> <button class="ok" id="edOk">Enregistrer</button></span></div>
  </div>
</div>
<input type="file" id="edFile" accept="image/*" hidden>

<script>
const $=s=>document.querySelector(s);
// sites par défaut : nom, domaine, couleur de marque, lettre de secours
const BASE=[
 ["YouTube","youtube.com","#ff0000","Y"],["Netflix","netflix.com","#e50914","N"],["Twitch","twitch.tv","#9146ff","T"],
 ["Spotify","open.spotify.com","#1db954","S"],["GitHub","github.com","#2b3137","G"],["Reddit","reddit.com","#ff4500","R"],
 ["Steam","store.steampowered.com","#1b2838","S"],["Discord","discord.com","#5865f2","D"],["Wikipédia","fr.wikipedia.org","#36414b","W"],
 ["Amazon","amazon.fr","#ff9900","a"],["Twitter","x.com","#1d1d1f","X"],["LinkedIn","linkedin.com","#0a66c2","in"],
 ["Instagram","instagram.com","#e1306c","I"],["Le Monde","lemonde.fr","#222","M"]];
// deux rangées = deux listes de vignettes modifiables {nom, lien, couleur, lettre, image?}
const V=[BASE.slice(0,7).map(f=>vg(f)),BASE.slice(7).concat(BASE.slice(0,3)).map(f=>vg(f))];
function vg([n,d,c,l]){return {n,u:"https://"+d,c,l,img:""}}
function host(u){try{return new URL(u).hostname.replace(/^www\./,"")}catch(e){return u}}
// logo réel : apple-touch-icon (net) -> favicon -> initiale. Le même logo sert de fond flouté (classe back) et de logo net (badge).
const ONERR="this.onerror=()=>this.replaceWith(Object.assign(document.createElement('span'),{className:'ltr',textContent:this.dataset.l}));this.src='https://'+this.dataset.h+'/favicon.ico'";
function imgTag(cls,v){return `<img class="${cls}" data-h="${host(v.u)}" data-l="${v.l}" loading="lazy" decoding="async" alt="" src="https://${host(v.u)}/apple-touch-icon.png" onerror="${ONERR}">`}
function cardHTML(v,i,j){
  // sans image perso : logo net sur le dégradé du site. Avec image perso : l'image remplit + le logo en petit badge.
  const body=v.img?`<img class="back" src="${v.img}" alt="">`+imgTag("badge",v):`<div class="logo">${imgTag("",v)}</div>`;
  return `<div class="card${v.img?" img":""}" style="--c:${v.c}" title="${v.n} · ${host(v.u)}">
    <button class="pen" data-i="${i}" data-j="${j}"><svg viewBox="0 0 24 24"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></button>
    ${body}<div class="meta"><b>${v.n}</b></div></div>`}
function drawRows(){
  $("#rows").innerHTML=V.map((list,i)=>{
    const cards=list.map((v,j)=>cardHTML(v,i,j)).join("");
    return `<div class="rail"><div class="head"><span>${i?"Souvent visités":"Préférés"}</span>
      <button class="addhead" data-i="${i}" data-j="-1" title="Ajouter une vignette">+</button></div>
      <div class="track ${i?"ltr":"rtl"}">${cards}${cards}</div></div>`}).join("");
  document.querySelectorAll(".pen,.addhead").forEach(b=>b.onclick=e=>{e.stopPropagation();openEd(+b.dataset.i,+b.dataset.j)});
  // mesure la largeur d'UNE copie (le ruban contient 2 copies) -> distance de translation exacte + durée (même vitesse partout)
  requestAnimationFrame(()=>document.querySelectorAll(".track").forEach(t=>{const w=t.scrollWidth/2;t.style.setProperty("--w",w+"px");t.style.setProperty("--d",(w/70)+"s")}));
}
const edN=$("#edN"),edU=$("#edU"),edImg=$("#edImg"),edCol=$("#edCol");let cur={i:0,j:-1,img:""};
function setPrev(img){cur.img=img||"";edImg.style.background=img?`center/cover no-repeat url('${img}')`:"var(--bg3)";edImg.innerHTML=img?"":"<small>aucune image : logo du site</small>"}
function openEd(i,j){const v=j<0?{n:"",u:"",img:"",c:"#9b5cff"}:V[i][j];cur={i,j,img:v.img||""};
  edN.value=v.n||"";edU.value=v.u||"";edCol.value=/^#[0-9a-f]{6}$/i.test(v.c)?v.c:"#9b5cff";setPrev(v.img);$(".del").style.display=j<0?"none":"";$("#ed").classList.add("on")}
$("#edCancel").onclick=()=>$("#ed").classList.remove("on");
// « Auto » : dans Volt, la couleur est calculée d'après le logo du site ; ici on remet celle du site connu.
$("#edColAuto").onclick=()=>{const v=cur.j<0?null:V[cur.i][cur.j];edCol.value=v&&/^#[0-9a-f]{6}$/i.test(v.c)?v.c:"#9b5cff"};
$("#edOk").onclick=()=>{const u=edU.value.trim(),n=edN.value.trim()||host(u)||"Site";
  const v={n,u,img:cur.img,c:edCol.value,l:(host(u)[0]||"?").toUpperCase()};
  if(cur.j<0)V[cur.i].push(v);else V[cur.i][cur.j]=v;$("#ed").classList.remove("on");drawRows()};
$(".del").onclick=()=>{V[cur.i].splice(cur.j,1);$("#ed").classList.remove("on");drawRows()};
$("#edClr").onclick=()=>setPrev("");
$("#edPic").onclick=()=>$("#edFile").click();
$("#edFile").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>setPrev(r.result);r.readAsDataURL(f);e.target.value=""};
drawRows();

// chaque dossier : icône, couleur, nb de sites, et les DOMAINES de ses sites (pour afficher les vrais favicons)
const dirs=[
 ["Jeux","🎮","#c084fc",22,["store.steampowered.com","epicgames.com","twitch.tv","riotgames.com","ea.com","xbox.com"]],
 ["Dev","💻","#34d399",25,["github.com","stackoverflow.com","gitlab.com","docker.com","developer.mozilla.org","npmjs.com"]],
 ["Vidéos","🎬","#f87171",18,["youtube.com","netflix.com","twitch.tv","disneyplus.com","primevideo.com","dailymotion.com"]],
 ["Achats","🛒","#fb923c",18,["amazon.fr","fnac.com","cdiscount.com","vinted.fr","aliexpress.com","ebay.fr"]],
 ["Actualités","📰","#818cf8",20,["lemonde.fr","lefigaro.fr","bbc.com","francetvinfo.fr","20minutes.fr","reuters.com"]]];
// favicon réel du site, repli sur l'initiale du domaine
function favCell(d){const l=d.replace(/^www\./,"")[0].toUpperCase();return `<div class="cell"><img src="https://${d}/apple-touch-icon.png" loading="lazy" decoding="async" alt="" data-f="https://${d}/favicon.ico" data-l="${l}" onerror="this.onerror=()=>this.replaceWith(Object.assign(document.createElement('span'),{className:'ltr',textContent:this.dataset.l}));this.src=this.dataset.f"></div>`}
$("#folders").innerHTML=dirs.map(([n,e,c,k,sites])=>
  `<div class="folder" style="--c:${c}"><div class="box">
     <div class="mosaic">${sites.map(favCell).join("")}</div>
     <span class="ic">${e}</span></div><b>${n}</b><small>${k} sites</small></div>`).join("");
$("#tiles").innerHTML=BASE.map(([n,d,c,l])=>`<div class="tile"><div class="ic" style="background:${c}"><span style="font-weight:700;color:#fff">${l}</span></div><span>${n}</span></div>`).join("");
</script>
</body>
</html>
