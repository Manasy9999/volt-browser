<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="dark">
<title>Vignettes style Netflix — page de favoris</title>
<style>
:root{--a:#9b5cff;--bg:#0b0c10;--bg2:#13151c;--bg3:#1b1e28;--tx:#e8e9f0;--mu:#7d8296;--r:10px}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--bg);color:var(--tx);font:13px "Segoe UI Variable Text","Segoe UI",system-ui,sans-serif}
body{padding:0}
h2{font-size:15px}
small{color:var(--mu)}

/* --- faux chrome du navigateur (repris de ui.html) --- */
#tabs{height:38px;display:flex;align-items:flex-end;gap:4px;padding:0 8px;background:var(--bg)}
#logo{width:30px;height:30px;margin:0 6px 4px 0;display:grid;place-items:center;color:var(--a)}
#logo svg{width:20px;height:20px;fill:var(--a)}
.tab{height:32px;min-width:150px;display:flex;align-items:center;gap:8px;padding:0 10px 0 12px;background:var(--bg3);color:var(--tx);border-radius:var(--r) var(--r) 0 0}
.tab .dot{width:8px;height:8px;border-radius:50%;background:var(--a)}
#bar{height:46px;display:flex;align-items:center;gap:8px;padding:0 10px;background:var(--bg2)}
#url{flex:1;height:30px;border-radius:999px;background:var(--bg);border:0;color:var(--tx);padding:0 14px;font:inherit}
#favbar{height:30px;display:flex;align-items:center;gap:10px;padding:0 10px;background:var(--bg3);font-size:12px;color:var(--mu)}
#favbar b{color:var(--tx);font-weight:500}

/* --- page de favoris --- */
#board{padding:22px 28px 60px}
#wrap{max-width:1040px;margin:0 auto} /* favoris centrés sur la page */
.search{max-width:680px;margin:0 auto 26px;height:46px;border-radius:999px;background:var(--bg2);display:flex;align-items:center;gap:10px;padding:0 18px;color:var(--mu)}
.folders,.tiles{justify-content:center}
.tiles{justify-items:center}
.cap{color:var(--mu);font-size:12px;font-weight:600;letter-spacing:.4px;text-transform:uppercase;margin:0 0 12px}

/* --- rangées Netflix (le cœur de la maquette) --- */
.rows{margin-bottom:34px}
.rail{position:relative;margin-bottom:16px}
.rowhead{display:flex;align-items:baseline;gap:10px;margin:0 0 10px 2px}
.rowhead h2{font-size:15px}
.scroller{display:flex;gap:14px;overflow-x:auto;scroll-behavior:smooth;scrollbar-width:none;padding:6px 2px 10px}
.scroller::-webkit-scrollbar{display:none}
.nav{position:absolute;top:36px;width:38px;bottom:16px;display:grid;place-items:center;background:linear-gradient(90deg,var(--bg),transparent);border:0;color:var(--tx);cursor:pointer;opacity:0;transition:opacity .2s;z-index:2}
.rail:hover .nav{opacity:1}
.nav.r{right:0;background:linear-gradient(270deg,var(--bg),transparent)}
.nav svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 6px #000)}

/* carte paysage (style A) : grande tuile aux couleurs du site */
.card{flex:none;width:230px;height:118px;border-radius:14px;overflow:hidden;position:relative;cursor:pointer;background:var(--bg2);
  transition:transform .18s cubic-bezier(.2,.8,.2,1),box-shadow .18s;will-change:transform}
.card::before{content:"";position:absolute;inset:0;background:linear-gradient(135deg,var(--c),color-mix(in srgb,var(--c) 30%,#000) 120%);opacity:.92}
.card .fav{position:absolute;top:12px;left:12px;width:38px;height:38px;border-radius:10px;background:#ffffff26;backdrop-filter:blur(4px);display:grid;place-items:center;z-index:1}
.card .fav img{width:24px;height:24px}
.card .meta{position:absolute;left:14px;right:14px;bottom:12px;z-index:1;text-shadow:0 1px 6px #0009}
.card .meta b{display:block;font-size:15px;font-weight:600}
.card .meta span{font-size:11.5px;opacity:.85}
.card:hover{transform:scale(1.07) translateY(-2px);box-shadow:0 10px 30px #000a,0 0 0 2px var(--a)}

/* carte affiche (style B) : plus haute, icône centrée */
body.poster .card{width:150px;height:170px}
body.poster .card .fav{position:static;width:64px;height:64px;border-radius:16px;margin:26px auto 0}
body.poster .card .fav img{width:40px;height:40px}
body.poster .card .meta{text-align:center;bottom:16px}

/* --- dossiers + favoris existants (contexte, inchangés) --- */
.folders{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:28px}
.folder{width:120px;cursor:pointer}
.folder .box{width:120px;height:72px;border-radius:14px;background:color-mix(in srgb,var(--c) 22%,var(--bg2));border:1px solid color-mix(in srgb,var(--c) 40%,transparent);display:grid;place-items:center;font-size:26px}
.folder b{display:block;margin-top:8px;font-size:13px}
.folder small{font-size:11px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,96px);gap:14px}
.tile{width:96px;text-align:center;cursor:pointer}
.tile .ic{width:52px;height:52px;margin:0 auto 6px;border-radius:14px;display:grid;place-items:center;background:var(--bg2)}
.tile .ic img{width:30px;height:30px}
.tile span{font-size:12px;color:var(--mu);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* --- barre de choix de style (hors Volt, juste pour la démo) --- */
#demo{position:fixed;top:10px;right:14px;z-index:9;display:flex;gap:6px;background:#000a;backdrop-filter:blur(6px);border:1px solid #fff2;border-radius:999px;padding:5px}
#demo button{font:inherit;color:var(--mu);background:none;border:0;padding:6px 12px;border-radius:999px;cursor:pointer}
#demo button.on{background:var(--a);color:#fff}
</style>
</head>
<body>
<div id="demo">
  <button id="bA" class="on">A · cartes paysage</button>
  <button id="bB">B · affiches</button>
</div>

<div id="tabs"><div id="logo"><svg viewBox="0 0 24 24"><path d="M13 2 4 14h6l-1 8 9-12h-6z"/></svg></div><div class="tab"><i class="dot"></i>Favoris</div></div>
<div id="bar"><input id="url" value="volt://newtab" readonly></div>
<div id="favbar"><b>Jeux</b> · <b>Dev</b> · <b>Vidéos</b> · <b>Achats</b> · YouTube · Twitch · GitHub · <b>+27</b></div>

<main id="board">
  <div id="wrap">
  <div class="search"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg> Rechercher sur Google ou saisir une adresse</div>

  <div class="rows" id="rows"></div>

  <h3 class="cap">Dossiers</h3>
  <div class="folders" id="folders"></div>
  <h3 class="cap">Sans dossier</h3>
  <div class="tiles" id="tiles"></div>
  </div>
</main>

<script>
const dot=(c,l)=>`data:image/svg+xml,${encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><rect width='24' height='24' rx='6' fill='${c}'/><text x='12' y='17' font-size='13' font-family='Segoe UI,sans-serif' font-weight='700' text-anchor='middle' fill='#fff'>${l}</text></svg>`)}`;
// sites préférés : nom, domaine, couleur de marque, lettre (icône de démo)
const S=[
 ["YouTube","youtube.com","#ff0000","Y"],["Netflix","netflix.com","#e50914","N"],["Twitch","twitch.tv","#9146ff","T"],
 ["Spotify","open.spotify.com","#1db954","S"],["GitHub","github.com","#d1d5db","G"],["Reddit","reddit.com","#ff4500","R"],
 ["Steam","store.steampowered.com","#1b2838","S"],["Discord","discord.com","#5865f2","D"],["Wikipédia","fr.wikipedia.org","#dfe3e8","W"],
 ["Amazon","amazon.fr","#ff9900","a"],["X","x.com","#1d1d1f","X"],["LinkedIn","linkedin.com","#0a66c2","in"],
 ["Le Monde","lemonde.fr","#222","M"],["Instagram","instagram.com","#e1306c","I"],["Figma","figma.com","#a259ff","F"]];
// deux rangées : "Préférés" et "Souvent visités"
const rows=[["Préférés",S.slice(0,10)],["Souvent visités",[...S.slice(5),...S.slice(0,5)]]];
document.getElementById("rows").innerHTML=rows.map(([t,list],i)=>`
  <div class="rail">
    <button class="nav l" data-d="-1" data-i="${i}"><svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg></button>
    <div class="rowhead"><h2>${t}</h2><small>${list.length} sites</small></div>
    <div class="scroller" id="sc${i}">${list.map(([n,d,c,l])=>`
      <div class="card" style="--c:${c}" title="${n} · ${d}">
        <div class="fav"><img src="${dot(c,l)}" alt=""></div>
        <div class="meta"><b>${n}</b><span>${d}</span></div>
      </div>`).join("")}</div>
    <button class="nav r" data-d="1" data-i="${i}"><svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg></button>
  </div>`).join("");
document.querySelectorAll(".nav").forEach(b=>b.onclick=()=>document.getElementById("sc"+b.dataset.i).scrollBy({left:b.dataset.d*500,behavior:"smooth"}));

const dirs=[["Jeux","🎮","#c084fc",22],["Dev","💻","#34d399",25],["Vidéos","🎬","#f87171",18],["Achats","🛒","#fb923c",18],["Actualités","📰","#818cf8",20]];
document.getElementById("folders").innerHTML=dirs.map(([n,e,c,k])=>`<div class="folder" style="--c:${c}"><div class="box">${e}</div><b>${n}</b><small>${k} sites</small></div>`).join("");
document.getElementById("tiles").innerHTML=S.map(([n,d,c,l])=>`<div class="tile"><div class="ic"><img src="${dot(c,l)}" alt=""></div><span>${n}</span></div>`).join("");

document.getElementById("bA").onclick=()=>{document.body.classList.remove("poster");bA.classList.add("on");bB.classList.remove("on")};
document.getElementById("bB").onclick=()=>{document.body.classList.add("poster");bB.classList.add("on");bA.classList.remove("on")};
</script>
</body>
</html>
