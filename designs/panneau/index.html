<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>Panneau Historique et Cookies</title>
<meta name="viewport" content="width=1280">
<style>
/* Variables recopiées de src/ui.html (thème par défaut). Couleurs et rayons : uniquement ces variables. */
:root{--a:#9b5cff;--bg:#0b0c10;--bg2:#13151c;--bg3:#1b1e28;--tx:#e8e9f0;--mu:#7d8296;--r:10px}
*{box-sizing:border-box;margin:0}
html{scrollbar-width:none;overflow-x:hidden}
html,body{background:var(--bg);color:var(--tx);font:13px "Segoe UI Variable Text","Segoe UI",system-ui,sans-serif}
button,input{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
:focus-visible{outline:2px solid var(--a);outline-offset:-2px}
.line{border-color:color-mix(in srgb,var(--tx) 7%,transparent)}

/* --- sélecteur de maquette (hors fenêtre) --- */
.sel{height:96px;padding:10px 16px 0;background:var(--bg2);border-bottom:1px solid var(--bg3);width:1280px}
.sel .top{display:flex;align-items:center;gap:6px;height:32px}
.sel h1{font-size:13px;font-weight:600;margin-right:10px;color:var(--mu)}
.dz{height:30px;display:flex;align-items:center;gap:8px;padding:0 12px 0 4px;border-radius:8px;color:var(--mu);transition:background .15s,color .15s}
.dz b{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;background:var(--bg3);color:var(--tx);font-weight:700;font-variant-numeric:tabular-nums}
.dz:hover{color:var(--tx);background:var(--bg3)}
.dz.on{color:var(--tx);background:color-mix(in srgb,var(--a) 18%,transparent)}
.dz.on b{background:var(--a);color:#fff}
.st{margin-left:auto;display:flex;gap:2px}
.st button{height:26px;padding:0 10px;border-radius:6px;color:var(--mu);transition:background .15s,color .15s}
.st button:hover{color:var(--tx);background:var(--bg3)}
.st button.on{color:var(--tx);background:var(--bg3)}
.sel p{line-height:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sel p:first-of-type{margin-top:6px}
.sel p i{font-style:normal;color:var(--mu);display:inline-block;width:74px}
.sel .gp{color:var(--mu)}
.sel .gp em{font-style:normal;color:var(--tx)}

/* --- fenêtre : onglets + barre d'adresse fidèles à ui.html --- */
.win{width:1280px;height:800px;display:flex;flex-direction:column;overflow:hidden;background:var(--bg)}
#tabs{height:38px;flex:none;display:flex;align-items:flex-end;gap:4px;padding:0 8px;background:var(--bg)}
#logo{width:30px;height:30px;margin:0 6px 4px 0;display:grid;place-items:center;filter:drop-shadow(0 0 6px var(--a))}
#logo svg{width:20px;height:20px;fill:var(--a);stroke:none}
#list{flex:1;min-width:0;height:100%;display:flex;align-items:flex-end;gap:inherit;overflow:hidden}
.tab{position:relative;height:32px;min-width:110px;flex-shrink:0;max-width:220px;flex:1;display:flex;align-items:center;gap:8px;padding:0 8px 0 12px;background:var(--bg2);border-radius:var(--r) var(--r) 0 0;color:var(--mu)}
.tab.on{background:var(--bg3);color:var(--tx)}
.tab.on::before{content:"";position:absolute;left:10px;right:10px;top:0;height:2px;border-radius:2px;background:var(--a);box-shadow:0 0 10px var(--a)}
.tab span{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.dot{width:8px;height:8px;border-radius:50%;background:var(--mu);flex:none}
.tab.on .dot{background:var(--a)}
.x{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;color:var(--mu);flex:none;transition:background .15s,color .15s}
.x svg{width:12px;height:12px}
.x:hover{color:var(--tx);background:color-mix(in srgb,var(--tx) 10%,transparent)}
.tab .x{opacity:.6}
#add{width:30px;height:30px;margin-bottom:2px;border-radius:8px;display:grid;place-items:center;color:var(--mu)}
.wc{display:flex;align-self:stretch;margin:0 -8px 0 6px}
.wc button{width:46px;display:grid;place-items:center;color:var(--mu)}
.wc svg{width:14px;height:14px;stroke-width:1.5}
#bar{height:46px;flex:none;display:flex;align-items:center;gap:4px;padding:0 8px;background:var(--bg3);border-bottom:1px solid var(--bg)}
.ib{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;color:var(--mu);transition:background .15s,color .15s}
.ib:hover{color:var(--tx);background:color-mix(in srgb,var(--tx) 6%,transparent)}
.ib.on{color:var(--a);background:color-mix(in srgb,var(--a) 14%,transparent)}
.ib:active{transform:translateY(1px)}
.vsep{width:1px;height:18px;background:var(--mu);opacity:.3;margin:0 4px;flex:none}
#url{flex:1;height:32px;margin:0 6px;padding:0 14px;border-radius:16px;border:1px solid transparent;background:var(--bg);color:var(--tx);outline:0}
/* icône Historique dans la bande d'onglets (design 3) */
.tb-h{width:30px;height:30px;margin:0 2px 4px -2px;border-radius:8px;display:grid;place-items:center;color:var(--mu);flex:none;transition:background .15s,color .15s}
.tb-h:hover{color:var(--tx);background:var(--bg2)}
.tb-h.on{color:var(--a);background:color-mix(in srgb,var(--a) 14%,transparent)}

/* --- barre de favoris : style « Étagères », une seule rangée de 30 px --- */
#fav{height:30px;flex:none;display:flex;align-items:center;gap:1px;padding:0 6px;overflow:hidden;background:color-mix(in srgb,var(--a) 7%,var(--bg3));border-bottom:1px solid var(--bg)}
.it{display:flex;align-items:center;gap:7px;height:24px;padding:0 8px;border-radius:6px;white-space:nowrap;flex:none;max-width:200px;color:var(--tx);transition:background .12s}
.it span{overflow:hidden;text-overflow:ellipsis}
.it:hover{background:color-mix(in srgb,var(--tx) 9%,transparent)}
.it.dir{color:var(--tx)}
.it .dt{width:7px;height:7px;border-radius:50%;background:var(--c);flex:none}
.it small{font-size:11px;color:var(--mu);font-variant-numeric:tabular-nums}
.fsep{width:1px;height:16px;background:var(--mu);opacity:.35;margin:0 6px;flex:none}
.more{height:24px;padding:0 9px;border-radius:12px;flex:none;color:var(--tx);font-weight:500;font-variant-numeric:tabular-nums;background:color-mix(in srgb,var(--tx) 9%,transparent)}

/* --- zone sous les barres : [rail] [panneau] [page web] --- */
.body{flex:1;min-height:0;display:flex}
.side{width:0;flex:none;overflow:hidden;background:var(--bg);transition:width .18s cubic-bezier(.2,.7,.2,1)}
.win.open .side{width:var(--pw);border-right:1px solid var(--bg3)}
.side .in{width:var(--pw);height:100%;display:flex;flex-direction:column;transition:visibility 0s .18s}
.win.open .side .in{transition:none}
.win:not(.open) .side .in{visibility:hidden}
.web{flex:1;min-width:0;position:relative;overflow:hidden;background:var(--bg2)}

/* rail permanent (design 2) */
.rail{width:44px;flex:none;display:flex;flex-direction:column;align-items:center;gap:4px;padding-top:8px;background:var(--bg3);border-right:1px solid var(--bg)}
.rb{position:relative;width:34px;height:34px;border-radius:8px;display:grid;place-items:center;color:var(--mu);transition:background .15s,color .15s}
.rb:hover{color:var(--tx);background:color-mix(in srgb,var(--tx) 6%,transparent)}
.rb.on{color:var(--a);background:color-mix(in srgb,var(--a) 14%,transparent)}
.rb.on::before{content:"";position:absolute;left:-5px;top:8px;bottom:8px;width:3px;border-radius:2px;background:var(--a)}
.rb .pip{position:absolute;right:5px;bottom:5px;width:7px;height:7px;border-radius:50%;background:var(--a);box-shadow:0 0 0 2px var(--bg3)}

/* --- fausse page web --- */
.wtag{position:absolute;top:10px;right:12px;z-index:2;height:22px;padding:0 9px;border-radius:11px;display:flex;align-items:center;gap:6px;font:12px Consolas,monospace;color:var(--tx);background:color-mix(in srgb,var(--bg) 80%,transparent)}
.wtag svg{width:12px;height:12px;color:var(--a)}
.fk{padding:0 40px}
.fk .hd{height:52px;display:flex;align-items:center;gap:14px;border-bottom:1px solid var(--bg3);margin:0 -40px 22px;padding:0 40px}
.fk .hd i{display:block;height:10px;border-radius:5px;background:var(--bg3)}
.fk .hd .lg{width:96px;height:22px;border-radius:6px;background:color-mix(in srgb,var(--tx) 14%,var(--bg3))}
.fk .hero{display:block;height:200px;border-radius:12px;margin-bottom:22px;background:linear-gradient(120deg,var(--bg3),color-mix(in srgb,var(--a) 10%,var(--bg3)))}
.fk .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}
.fk .card{height:150px;border-radius:10px;background:var(--bg3);padding:96px 12px 0}
.fk .card i{display:block;height:9px;border-radius:5px;background:color-mix(in srgb,var(--tx) 10%,transparent);margin-bottom:8px}
.cover{position:absolute;inset:0;display:grid;place-items:center;align-content:center;gap:6px;background:var(--bg);color:var(--mu);text-align:center;padding:0 40px}
.cover b{color:var(--tx);font-size:16px;font-weight:600}

/* --- panneau : éléments communs --- */
.ph{height:48px;flex:none;display:flex;align-items:center;gap:8px;padding:0 8px 0 14px}
.ph h2{font-size:14px;font-weight:600;flex:1}
.seg{flex:1;display:flex;gap:2px;padding:3px;border-radius:9px;background:var(--bg2)}
.seg button{flex:1;height:30px;border-radius:7px;display:flex;align-items:center;justify-content:center;gap:7px;color:var(--mu);transition:background .15s,color .15s}
.seg button:hover{color:var(--tx)}
.seg button.on{background:var(--bg3);color:var(--tx);font-weight:500}
.seg button svg{width:15px;height:15px}
.seg .on svg{color:var(--a)}
.seg .pip{width:6px;height:6px;border-radius:50%;background:var(--a)}
.srch{flex:none;position:relative;margin:0 12px 6px}
.srch svg{position:absolute;left:10px;top:9px;width:14px;height:14px;color:var(--mu)}
.srch input{width:100%;height:32px;padding:0 10px 0 32px;border-radius:8px;border:1px solid var(--bg3);background:var(--bg2);outline:0;transition:border-color .15s}
.srch input:focus{border-color:var(--a)}
.srch input::placeholder{color:var(--mu)}
.scroll{flex:1;min-height:0;overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--bg3) transparent;padding-bottom:8px}
.hday{position:sticky;top:0;z-index:1;display:flex;justify-content:space-between;padding:10px 14px 5px 20px;background:var(--bg);font-size:12px;font-weight:600;color:var(--mu)}
.hday small{font-weight:400;font-variant-numeric:tabular-nums}
.he{display:flex;align-items:center;gap:10px;height:44px;padding:0 6px 0 14px;margin:0 6px;border-radius:8px;cursor:pointer;transition:background .12s}
.he:hover{background:var(--bg2)}
.he:active{background:var(--bg3)}
.he .t{flex:1;min-width:0;line-height:17px}
.he .t b{display:block;font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.he .t small{display:block;font-size:12px;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.he time{width:36px;text-align:right;font-size:12px;color:var(--mu);font-variant-numeric:tabular-nums;flex:none}
.he .x{display:none}
.he:hover time{display:none}
.he:hover .x,.he:focus-within .x{display:grid}
.he.cur .t b{color:var(--a)}
/* variante compacte une ligne (design 2) */
.he.c{height:30px;gap:9px;padding-left:10px}
.he.c time{order:-1;width:34px;text-align:left}
.he.c .t{display:flex;gap:7px;align-items:baseline}
.he.c .t b{flex:1;min-width:0}
.he.c .t small{flex:none;max-width:96px}
.he.c:hover time{display:block;visibility:hidden}
.empty{padding:28px 20px;color:var(--mu);line-height:1.5;text-align:center}
.empty b{display:block;color:var(--tx);font-weight:500;margin-bottom:2px}
.pf{flex:none;display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:46px;padding:6px 8px 6px 12px;border-top:1px solid var(--bg3)}
.lnk{height:30px;padding:0 8px;border-radius:7px;display:flex;align-items:center;gap:6px;color:var(--mu);transition:background .15s,color .15s}
.lnk:hover{color:var(--tx);background:var(--bg2)}
.lnk svg{width:14px;height:14px}
.cf{flex:none;padding:12px;border-top:1px solid var(--bg3);background:var(--bg2)}
.cf p{line-height:1.45;margin-bottom:10px}
.cf p small{display:block;color:var(--mu)}
.cf .bs{display:flex;justify-content:flex-end;gap:6px}
.btn{height:32px;padding:0 14px;border-radius:8px;background:var(--a);color:#fff;font-weight:600;transition:filter .15s}
.btn:hover{filter:brightness(1.15)}
.btn:active{transform:translateY(1px)}
.btn.g{background:var(--bg3);color:var(--tx);font-weight:500}
.btn.w{width:100%}

/* cookies */
.ck{padding:4px 12px 12px}
.ck h3{font-size:12px;font-weight:600;color:var(--mu);margin:14px 2px 6px;display:flex;justify-content:space-between}
.ck h3:first-child{margin-top:4px}
.ck h3 small{font-weight:400;font-size:12px;font-variant-numeric:tabular-nums}
.box{background:var(--bg2);border-radius:var(--r);padding:12px;margin-bottom:6px}
.site{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.site .ico{width:28px;height:28px;border-radius:7px;background:var(--bg3)}
.site .ico img{width:20px;height:20px}
.site b{display:block;font-weight:500}
.site small{color:var(--mu);font-variant-numeric:tabular-nums}
.hint{display:block;color:var(--mu);font-size:12px;line-height:1.4;margin-top:6px}
.sr{display:flex;align-items:center;gap:12px;justify-content:space-between}
.sr>div{min-width:0}
.sr b{font-weight:500;display:block}
.sr small{display:block;color:var(--mu);font-size:12px;line-height:1.4;margin-top:2px}
.sr.dis{opacity:.45}
.sr+.sr,.choice+.sr{margin-top:12px;padding-top:12px;border-top:1px solid var(--bg3)}
.sw{appearance:none;width:40px;height:22px;border-radius:11px;background:var(--bg3);position:relative;cursor:pointer;transition:background .2s;flex:none;margin:0}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:var(--mu);transition:left .2s,background .2s}
.sw:checked{background:var(--a)}
.sw:checked::after{left:21px;background:#fff}
.sw:disabled{cursor:default}
.box .sw{background:var(--bg)}
.box .sw:checked{background:var(--a)}
.choice{margin-top:12px}
.rad{display:flex;gap:2px;padding:3px;border-radius:9px;background:var(--bg)}
.rad button{flex:1;height:30px;border-radius:7px;color:var(--mu);transition:background .15s,color .15s}
.rad button:hover{color:var(--tx)}
.rad button.on{background:color-mix(in srgb,var(--a) 22%,var(--bg3));color:var(--tx);font-weight:600;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--a) 55%,transparent)}
.rad button small{font-weight:400;color:var(--mu);margin-left:4px}
.cnt{display:flex;align-items:center;gap:6px;color:var(--mu);font-size:12px;margin-top:10px;font-variant-numeric:tabular-nums}
.cnt svg{width:13px;height:13px;color:var(--a)}
.done{color:var(--mu);font-size:12px;margin-top:8px;display:flex;gap:6px;align-items:center}
.done svg{width:13px;height:13px;color:var(--a)}

/* carte repliable (design 3) */
.card3{flex:none;margin:0 12px 10px;border-radius:var(--r);background:var(--bg2);overflow:hidden}
.card3>button{width:100%;display:flex;align-items:center;gap:10px;padding:10px 10px 10px 12px;text-align:left;transition:background .15s}
.card3>button:hover{background:color-mix(in srgb,var(--tx) 4%,var(--bg2))}
.card3 .ci{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:color-mix(in srgb,var(--a) 16%,var(--bg3));color:var(--a);flex:none}
.card3 .ci.off{background:var(--bg3);color:var(--mu)}
.card3 .sm{flex:1;min-width:0;line-height:17px}
.card3 .sm b{display:block;font-weight:500}
.card3 .sm small{display:block;color:var(--mu);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.card3 .chev{color:var(--mu);transition:transform .18s}
.card3.op .chev{transform:rotate(180deg)}
.card3 .ck{padding:0 10px 10px;border-top:1px solid var(--bg3)}
.card3 .box{background:var(--bg);margin-bottom:6px}
.card3 .box .sw{background:var(--bg3)}
.card3 .box .sw:checked{background:var(--a)}
.card3 .rad{background:var(--bg2)}
/* design 3 : une seule colonne qui défile ; la recherche reste collée en haut une fois la carte passée */
.d3 .srch{position:sticky;top:0;z-index:2;margin:0;padding:0 12px 6px;background:var(--bg)}
.d3 .srch svg{left:22px}
.d3 .hday{top:38px}

.ico{width:16px;height:16px;display:grid;place-items:center;font-size:10px;line-height:1;flex:none}
.ico img{width:16px;height:16px;border-radius:3px;display:block}
.ico.l{border-radius:4px;background:color-mix(in srgb,var(--tx) 16%,transparent);color:var(--tx);font-weight:600}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<header class="sel">
  <div class="top"><h1>Panneau Historique et cookies</h1>
    <button class="dz" data-act="d1"><b>1</b>Tiroir à deux onglets</button>
    <button class="dz" data-act="d2"><b>2</b>Rail d'icônes</button>
    <button class="dz" data-act="d3"><b>3</b>Colonne unique</button>
    <div class="st"><button data-act="s-hist">Historique</button><button data-act="s-ck">Cookies</button><button data-act="s-off">Panneau fermé</button></div>
  </div>
  <p id="pp"></p><p class="gp" id="gp"></p>
</header>
<div class="win" id="win"></div>
<script>
// ---------- icônes de sites : pastilles SVG inline aux couleurs des marques (reprises de designs/favoris/data.js) ----------
const P=(bg,inner,r=4)=>"data:image/svg+xml,"+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16"><rect width="16" height="16" rx="${r}" fill="${bg}"/>${inner}</svg>`);
const T=(c,t,s=10,w=700,f="Segoe UI")=>`<text x="8" y="8" dy=".36em" text-anchor="middle" font-family="${f}" font-size="${s}" font-weight="${w}" fill="${c}">${t}</text>`;
const ICONS={
  "YouTube":P("#ff0033",'<path d="M6.2 4.8v6.4L11.6 8z" fill="#fff"/>'),
  "Twitch":P("#9146ff",'<path d="M4 3.5h8.5v5.8L10 11.8H8l-1.8 1.8v-1.8H4z" fill="#fff"/><path d="M7.4 5.8v2.4M10 5.8v2.4" stroke="#9146ff" stroke-width="1.3"/>'),
  "GitHub":P("#24292f",'<circle cx="8" cy="9" r="4" fill="#fff"/><path d="M4.4 7 4.6 3.6 7.2 5.4M11.6 7l-.2-3.4-2.6 1.8" fill="#fff"/>',8),
  "Reddit":P("#ff4500",'<ellipse cx="8" cy="9.6" rx="4.6" ry="3.1" fill="#fff"/><circle cx="11.4" cy="4" r="1.2" fill="#fff"/><circle cx="6.3" cy="9.3" r=".9" fill="#ff4500"/><circle cx="9.7" cy="9.3" r=".9" fill="#ff4500"/>',8),
  "Steam":P("#1b2838",'<circle cx="10.3" cy="6" r="2.3" fill="none" stroke="#fff" stroke-width="1.3"/><circle cx="5.6" cy="10.6" r="1.7" fill="#fff"/><path d="m5.6 10.6 4.7-4.6" stroke="#fff" stroke-width="1.3"/>',8),
  "Wikipédia":P("#f4f4f4",T("#111","W",10,400,"Georgia"),8),
  "Le Monde":P("#111",T("#fff","M",11,700,"Georgia"),3),
  "Amazon":P("#232f3e",T("#fff","a",11,700)+'<path d="M4.2 12q3.8 2 7.6 0" stroke="#ff9900" stroke-width="1.3" fill="none"/>'),
  "Stack Overflow":P("#f2f2f2",'<path d="M3.6 9.5v3.7h8.8V9.5" stroke="#bcbbbb" stroke-width="1.3" fill="none"/><path d="M5.5 11.4h4.9M5.7 9.4l4.8.9M6.3 7.3l4.4 2M7.4 5.3l3.8 3" stroke="#f48024" stroke-width="1.2"/>'),
  "Discord":P("#5865f2",'<path d="M4 5.5q4-2 8 0l1 5.2q-1.4 1.3-3 1.6l-.6-1q-1.4.4-2.8 0l-.6 1q-1.6-.3-3-1.6z" fill="#fff"/><circle cx="6.4" cy="8.5" r=".9" fill="#5865f2"/><circle cx="9.6" cy="8.5" r=".9" fill="#5865f2"/>'),

    (c?`<div class="scroll">${cookies()}</div>`:`${search()}<div class="scroll" id="hl">${histRows(true)}</div>${histFoot()}`);
  if(d===3){
    const sum=S.auto?(S.exc?"Pas de réponse auto sur ce site":`Bandeaux ${S.mode==="ref"?"refusés":"acceptés"} automatiquement`):"Bandeaux : réponse auto désactivée";
    p.innerHTML=`<div class="ph"><h2>Historique et cookies</h2>${closeBtn}</div>
<div class="scroll d3"><section class="card3${c?" op":""}"><button data-act="card" aria-expanded="${c}"><span class="ci${S.auto?"":" off"}">${I.ck}</span><span class="sm"><b>${sum}</b>${S.auto?"<small>37 bandeaux traités cette semaine</small>":""}<small>Ce site : ${S.site?S.site+" cookies":"aucun cookie"}</small></span><span class="chev">${I.chev}</span></button>${c?cookies():""}</section>
${search()}<div id="hl">${histRows(false)}</div></div>${histFoot()}`;
  }
  marks();
}

// ---------- interactions ----------
function go(e){S.cur={s:e.s,title:e.title,dom:e.dom};S.full=false;const u=document.getElementById("url");u.value="https://"+e.dom+"/";
  document.querySelector(".tab.on span").textContent=e.title;document.getElementById("pg").innerHTML=page();S.site=7+e.id*3%31;fillPanel();}
const ACT={
  d1:()=>{S.d=1;build()},d2:()=>{S.d=2;build()},d3:()=>{S.d=3;build()},
  "s-hist":()=>{S.open=true;S.vue="hist";fillPanel()},"s-ck":()=>{S.open=true;S.vue="cookies";fillPanel()},"s-off":()=>{S.open=false;marks()},
  toggle:()=>{S.open=!S.open;marks()},close:()=>{S.open=false;marks()},
  "r-hist":()=>{if(S.open&&S.vue==="hist")S.open=false;else{S.open=true;S.vue="hist"}fillPanel()},
  "r-ck":()=>{if(S.open&&S.vue==="cookies")S.open=false;else{S.open=true;S.vue="cookies"}fillPanel()},
  "v-hist":()=>{S.vue="hist";fillPanel()},"v-ck":()=>{S.vue="cookies";fillPanel()},
  card:()=>{S.vue=S.vue==="cookies"?"hist":"cookies";fillPanel()},
  auto:t=>{S.auto=t.checked;fillPanel()},exc:t=>{S.exc=t.checked;fillPanel()},
  ref:()=>{S.mode="ref";fillPanel()},acc:()=>{S.mode="acc";fillPanel()},
  "site-del":()=>{S.site=0;fillPanel()},"all-del":()=>{S.confirm="cookies";fillPanel()},"all-ok":()=>{S.all=0;S.site=0;S.confirm="";fillPanel()},
  hclear:()=>{S.confirm="hist";fillPanel()},"hclear-ok":()=>{H.forEach(e=>e.gone=1);S.confirm="";S.q="";fillPanel()},cancel:()=>{S.confirm="";fillPanel()},
  full:()=>{S.full=true;document.getElementById("pg").innerHTML=page();document.getElementById("url").value="volt://reglages/historique"},
  rm:t=>{H[+t.closest(".he").dataset.id].gone=1;fillPanel()}
};
document.addEventListener("click",e=>{
  const a=e.target.closest("[data-act]");
  if(a&&a.type!=="checkbox"){ACT[a.dataset.act](a);return}
  const r=e.target.closest(".he");if(r)go(H[+r.dataset.id]);
});
document.addEventListener("change",e=>{const a=e.target.closest("input[data-act]");if(a)ACT[a.dataset.act](a)});
document.addEventListener("input",e=>{if(e.target.id!=="hq")return;S.q=e.target.value;document.getElementById("hl").innerHTML=histRows(S.d===2);sync()});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&S.open){S.open=false;marks()}
  if(e.ctrlKey&&e.key.toLowerCase()==="h"){e.preventDefault();S.open=!S.open;marks()}});
build();
</script></body></html>
