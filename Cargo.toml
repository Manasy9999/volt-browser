[package]
name = "volt"
version = "0.3.5"
edition = "2024"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tao = "0.37.3"
webview2-com = "0.39"
windows = { version = "0.62", features = ["Win32_System_SystemInformation", "Win32_System_Com_Urlmon", "Win32_System_Com", "Win32_Graphics_Imaging", "Win32_Graphics_Gdi", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading", "Win32_Foundation", "Win32_Globalization", "Win32_System_Performance", "Win32_System_ProcessStatus", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_System_Registry", "Win32_System_Pipes", "Win32_System_IO", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_Storage_FileSystem", "Win32_Security", "Win32_Security_Cryptography", "Win32_UI_WindowsAndMessaging", "Win32_System_LibraryLoader", "Win32_UI_Controls_Dialogs", "Security_Credentials_UI"] }
wry = "0.57.3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[build-dependencies]
winresource = "0.1.34"

